<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DecoHOME | Acceso al Portal Interno</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-stone-50 via-stone-100 to-orange-50/40 h-screen flex items-center justify-center text-stone-800 antialiased">
    
    <div class="bg-white p-10 rounded-2xl border border-stone-200 shadow-xl w-full max-w-md mx-4 transition-all">
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-gradient-to-r from-amber-700 to-amber-600 rounded-xl flex items-center justify-center shadow-sm mx-auto mb-4">
                <i class="fas fa-chair text-white text-xl"></i>
            </div>
            <h1 class="text-3xl font-bold tracking-tight text-stone-900 mb-1">Deco<span class="text-amber-700 font-light">HOME</span></h1>
            <p class="text-stone-500 text-sm mt-1">Portal interno de gestión y control de proyectos</p>
        </div>

        <form id="loginForm" action="/api/login" method="POST" class="space-y-5">
            <div>
                <label for="username" class="block text-sm font-semibold text-stone-700 mb-1.5">Correo Electrónico</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-stone-400">
                        <i class="fas fa-envelope"></i>
                    </span>
                    <input type="email" id="username" name="username" placeholder="empleado@decohome.es" class="w-full pl-10 pr-4 py-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-600 focus:bg-white transition text-stone-900 placeholder-stone-400 text-sm" required>
                </div>
            </div>
            
            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label for="password" class="block text-sm font-semibold text-stone-700">Contraseña</label>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-stone-400">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" id="password" name="password" placeholder="••••••••" class="w-full pl-10 pr-4 py-2.5 bg-stone-50 border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-600 focus:bg-white transition text-stone-900 placeholder-stone-400 text-sm" required>
                </div>
            </div>

            <button type="submit" class="w-full bg-amber-700 hover:bg-amber-800 text-white py-3 rounded-xl font-semibold shadow-sm transition transform hover:scale-[1.02] active:scale-[0.98] mt-2 flex items-center justify-center space-x-2">
                <span>Iniciar sesión</span>
                <i class="fas fa-arrow-right text-xs opacity-80"></i>
            </button>
        </form>

        <div id="errorMessage" class="hidden mt-5 p-3 bg-red-50 border border-red-200 rounded-xl flex items-center space-x-2 text-red-600 text-sm">
            <i class="fas fa-exclamation-circle"></i>
            <span>Credenciales incorrectas. Inténtalo de nuevo.</span>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(form);
            const response = await fetch('/api/login', {
                method: 'POST',
                body: JSON.stringify({
                    username: formData.get('username'),
                    password: formData.get('password')
                }),
                headers: {
                    'Content-Type': 'application/json'
                }
            });

            if (response.ok) {
                window.location.href = '/dashboard';
            } else {
                errorMessage.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
