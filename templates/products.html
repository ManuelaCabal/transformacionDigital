<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - CRM TechSolutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
    <div class="min-h-screen">
        <nav class="bg-slate-950 border-b border-slate-700 sticky top-0 z-50 shadow-lg">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center h-16">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-gradient-to-r from-blue-500 to-purple-600 rounded-lg flex items-center justify-center">
                            <i class="fas fa-boxes-stacked text-white"></i>
                        </div>
                        <h1 class="text-2xl font-bold text-white">TechSolutions CRM</h1>
                    </div>
                    <div class="flex items-center space-x-4">
                        <a href="/" class="text-slate-300 hover:text-white transition px-3 py-2 rounded-lg hover:bg-slate-800">
                            <i class="fas fa-home mr-2"></i>Inicio
                        </a>
                    </div>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="mb-8 flex items-center justify-between">
                <div>
                    <h2 class="text-3xl font-bold text-white mb-2">Catálogo de Productos</h2>
                    <p class="text-slate-400">Gestiona tu inventario y servicios</p>
                </div>
                <div class="flex items-center gap-4">
                    <a href="/dashboard" class="bg-slate-700 text-white px-4 py-2 rounded-lg hover:bg-slate-600 transition">Regresar</a>
                    <button id="btnNewProduct" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-lg font-semibold transition shadow-lg shadow-indigo-500/20">
                        <i class="fas fa-plus mr-2"></i>Nuevo Producto
                    </button>
                </div>
            </div>

            <div class="bg-slate-800 rounded-xl p-6 border border-slate-700 mb-8 shadow-xl">
                <div class="flex flex-wrap gap-4">
                    <div class="flex-1 min-w-[300px] relative">
                        <i class="fas fa-search absolute left-3 top-3 text-slate-500"></i>
                        <input type="text" id="searchProduct" placeholder="Buscar por nombre, SKU o descripción..." 
                               class="w-full bg-slate-900 border border-slate-700 text-white rounded-lg pl-10 pr-4 py-2 focus:outline-none focus:border-blue-500 transition">
                    </div>
                    <select id="categoryFilter" class="bg-slate-900 border border-slate-700 text-white rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500 transition min-w-[200px]">
                        <option value="">Todas las categorías</option>
                    </select>
                </div>
            </div>

            <div id="productsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="col-span-full text-center text-slate-400 py-12">
                    <i class="fas fa-circle-notch fa-spin text-3xl mb-4 text-blue-500"></i>
                    <p>Sincronizando inventario...</p>
                </div>
            </div>
        </main>
    </div>

    <div id="productModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center hidden z-[100]">
        <div class="bg-slate-900 rounded-2xl w-full max-w-2xl p-8 border border-slate-700 shadow-2xl mx-4">
            <div class="flex items-center justify-between mb-6">
                <h3 id="productModalTitle" class="text-xl font-bold text-white">Nuevo Producto</h3>
                <button id="productModalClose" class="text-slate-400 hover:text-white text-2xl transition">✕</button>
            </div>
            <form id="productForm" class="space-y-5">
                <input type="hidden" id="productId">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="md:col-span-1">
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1 ml-1">Nombre</label>
                        <input id="productName" required class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-lg text-white focus:border-blue-500 outline-none" />
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1 ml-1">SKU / Código</label>
                        <input id="productSKU" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-lg text-white focus:border-blue-500 outline-none" />
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1 ml-1">Descripción</label>
                        <textarea id="productDescription" rows="2" class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-lg text-white focus:border-blue-500 outline-none resize-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1 ml-1">Precio (€)</label>
                        <input id="productPrice" type="number" step="0.01" required class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-lg text-white focus:border-blue-500 outline-none" />
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1 ml-1">Stock Disponible</label>
                        <input id="productStock" type="number" required class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-lg text-white focus:border-blue-500 outline-none" />
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1 ml-1">Categoría</label>
                        <select id="productCategory" required class="w-full bg-slate-800 border border-slate-700 p-2.5 rounded-lg text-white focus:border-blue-500 outline-none">
                            </select>
                    </div>
                </div>
                <div class="flex justify-end pt-4">
                    <button type="submit" id="productSubmit" class="bg-indigo-600 hover:bg-indigo-700 px-10 py-3 rounded-lg text-white font-bold transition shadow-lg shadow-indigo-500/20">Crear</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let allProducts = []; // Cache local para filtrado rápido

        document.addEventListener('DOMContentLoaded', () => {
            init();
            document.getElementById('searchProduct').addEventListener('input', filterProducts);
            document.getElementById('categoryFilter').addEventListener('change', filterProducts);
            document.getElementById('btnNewProduct').addEventListener('click', () => openProductForm('create'));
            document.getElementById('productModalClose').addEventListener('click', () => document.getElementById('productModal').classList.add('hidden'));
        });

        async function init() {
            await loadCategories();
            await loadProducts();
        }

        async function loadProducts() {
            try {
                const response = await fetch(`${API_BASE}/products/`);
                allProducts = await response.json();
                displayProducts(allProducts);
            } catch (error) {
                showError('Error al conectar con la base de datos de productos.');
            }
        }

        async function loadCategories() {
            try {
                const response = await fetch(`${API_BASE}/products/categories`);
                const categories = await response.json();
                
                const filterSelect = document.getElementById('categoryFilter');
                const formSelect = document.getElementById('productCategory');
                
                categories.forEach(cat => {
                    const opt = `<option value="${cat.id}">${cat.name}</option>`;
                    filterSelect.insertAdjacentHTML('beforeend', opt);
                    formSelect.insertAdjacentHTML('beforeend', opt);
                });
            } catch (e) { console.error('Categorías no disponibles'); }
        }

        function displayProducts(products) {
            const grid = document.getElementById('productsGrid');
            if (products.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center text-slate-500 py-12">No se encontraron productos</div>';
                return;
            }
            
            grid.innerHTML = products.map(p => `
                <div class="bg-slate-800 rounded-2xl border border-slate-700 overflow-hidden hover:border-indigo-500/50 transition-all duration-300 group shadow-lg">
                    <div class="bg-gradient-to-br from-indigo-600/20 to-purple-600/20 h-24 flex items-center justify-center border-b border-slate-700">
                        <i class="fas fa-box text-indigo-400 text-3xl group-hover:scale-110 transition-transform"></i>
                    </div>
                    <div class="p-6">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="text-lg font-bold text-white leading-tight">${p.name}</h3>
                            <span class="text-[10px] bg-slate-900 text-slate-400 px-2 py-1 rounded border border-slate-700 font-mono">${p.sku || 'N/A'}</span>
                        </div>
                        <p class="text-slate-400 text-xs mb-4 line-clamp-2 h-8">${p.description || 'Sin descripción detallada'}</p>
                        
                        <div class="flex items-center justify-between p-3 bg-slate-900/50 rounded-xl mb-5">
                            <div>
                                <span class="block text-[10px] text-slate-500 uppercase font-bold">Precio</span>
                                <span class="text-xl font-black text-green-400">€${parseFloat(p.price).toFixed(2)}</span>
                            </div>
                            <div class="text-right">
                                <span class="block text-[10px] text-slate-500 uppercase font-bold">Stock</span>
                                <span class="text-sm font-bold ${p.stock > 0 ? 'text-blue-400' : 'text-red-400'}">${p.stock} uds</span>
                            </div>
                        </div>

                        <div class="flex gap-2">
                            <button onclick="openProductForm('edit', ${p.id})" class="flex-1 bg-slate-700 hover:bg-indigo-600 text-white py-2 rounded-lg transition text-sm font-semibold">
                                <i class="fas fa-pen-to-square mr-2"></i>Editar
                            </button>
                            <button onclick="deleteProduct(${p.id})" class="w-10 bg-slate-700 hover:bg-red-600 text-white py-2 rounded-lg transition">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterProducts() {
            const query = document.getElementById('searchProduct').value.toLowerCase();
            const catId = document.getElementById('categoryFilter').value;
            
            const filtered = allProducts.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(query) || 
                                     (p.description && p.description.toLowerCase().includes(query)) ||
                                     (p.sku && p.sku.toLowerCase().includes(query));
                const matchesCat = !catId || p.category_id == catId;
                return matchesSearch && matchesCat;
            });
            displayProducts(filtered);
        }

        function openProductForm(mode, id = null) {
            const modal = document.getElementById('productModal');
            const form = document.getElementById('productForm');
            const submitBtn = document.getElementById('productSubmit');
            form.reset();

            if (mode === 'create') {
                document.getElementById('productModalTitle').textContent = 'Nuevo Producto';
                submitBtn.textContent = 'Crear Producto';
                submitBtn.dataset.mode = 'create';
                modal.classList.remove('hidden');
            } else {
                fetch(`${API_BASE}/products/${id}`).then(r => r.json()).then(p => {
                    document.getElementById('productId').value = p.id;
                    document.getElementById('productName').value = p.name;
                    document.getElementById('productSKU').value = p.sku || '';
                    document.getElementById('productDescription').value = p.description || '';
                    document.getElementById('productPrice').value = p.price;
                    document.getElementById('productStock').value = p.stock;
                    document.getElementById('productCategory').value = p.category_id;
                    
                    document.getElementById('productModalTitle').textContent = 'Editar Producto';
                    submitBtn.textContent = 'Guardar Cambios';
                    submitBtn.dataset.mode = 'edit';
                    modal.classList.remove('hidden');
                });
            }
        }

        document.getElementById('productForm').onsubmit = async (e) => {
            e.preventDefault();
            const mode = document.getElementById('productSubmit').dataset.mode;
            const id = document.getElementById('productId').value;
            const payload = {
                name: document.getElementById('productName').value,
                sku: document.getElementById('productSKU').value,
                description: document.getElementById('productDescription').value,
                price: parseFloat(document.getElementById('productPrice').value),
                stock: parseInt(document.getElementById('productStock').value),
                category_id: parseInt(document.getElementById('productCategory').value)
            };

            const url = mode === 'create' ? `${API_BASE}/products/` : `${API_BASE}/products/${id}`;
            try {
                const res = await fetch(url, {
                    method: mode === 'create' ? 'POST' : 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    document.getElementById('productModal').classList.add('hidden');
                    loadProducts();
                }
            } catch (err) { alert("Error al guardar el producto"); }
        };

        async function deleteProduct(id) {
            if (confirm('¿Deseas eliminar este producto del inventario?')) {
                await fetch(`${API_BASE}/products/${id}`, { method: 'DELETE' });
                loadProducts();
            }
        }

        function showError(message) {
            document.getElementById('productsGrid').innerHTML = `<div class="col-span-full text-center text-red-400 py-12">❌ ${message}</div>`;
        }
    </script>
</body>
</html>
