<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Productos | DecoHOME CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-gradient-to-br from-stone-50 via-stone-100 to-orange-50/30 text-stone-800 antialiased min-h-screen">
    <div class="min-h-screen">
        <nav class="bg-white border-b border-stone-200 sticky top-0 z-50 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center h-16">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-gradient-to-r from-amber-700 to-amber-600 rounded-lg flex items-center justify-center shadow-sm">
                            <i class="fas fa-chair text-white"></i>
                        </div>
                        <h1 class="text-2xl font-bold text-stone-900">Deco<span class="text-amber-700 font-light">HOME</span></h1>
                    </div>
                    <div class="flex items-center space-x-4">
                        <a href="/" class="text-stone-600 hover:text-amber-700 transition px-3 py-2 rounded-lg hover:bg-stone-100 font-medium text-sm">
                            <i class="fas fa-home mr-2"></i>Inicio
                        </a>
                    </div>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="mb-8 flex items-center justify-between">
                <div>
                    <h2 class="text-3xl font-bold text-stone-900 mb-1">Catálogo de Productos</h2>
                    <p class="text-stone-500 text-sm">Gestiona el inventario de mobiliario, iluminación, textiles y colecciones de temporada</p>
                </div>
                <div class="flex items-center gap-3">
                    <a href="/dashboard" class="bg-white border border-stone-200 text-stone-700 px-4 py-2.5 rounded-xl hover:bg-stone-50 shadow-sm font-semibold transition text-sm">Regresar</a>
                    <button id="btnNewProduct" class="bg-amber-700 hover:bg-amber-800 text-white px-5 py-2.5 rounded-xl font-semibold shadow-sm transition text-sm flex items-center">
                        <i class="fas fa-plus mr-2 text-xs"></i>Nuevo Producto
                    </button>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-5 border border-stone-200 shadow-sm mb-8">
                <div class="flex flex-wrap gap-4">
                    <div class="flex-1 min-w-[300px] relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-stone-400">
                            <i class="fas fa-search text-sm"></i>
                        </span>
                        <input type="text" id="searchProduct" placeholder="Buscar por artículo, acabado, SKU o descripción..." 
                               class="w-full bg-stone-50 border border-stone-200 text-stone-900 rounded-xl pl-10 pr-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-600 focus:bg-white transition">
                    </div>
                    <select id="categoryFilter" class="bg-stone-50 border border-stone-200 text-stone-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-600 focus:bg-white transition min-w-[200px]">
                        <option value="">Todas las colecciones</option>
                    </select>
                </div>
            </div>

            <div id="productsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="col-span-full text-center text-stone-400 py-12">
                    <i class="fas fa-circle-notch fa-spin text-3xl mb-4 text-amber-600"></i>
                    <p class="text-sm font-medium">Sincronizando inventario de DecoHOME...</p>
                </div>
            </div>
        </main>
    </div>

    <div id="productModal" class="fixed inset-0 bg-stone-900/60 backdrop-blur-sm flex items-center justify-center hidden z-[100]">
        <div class="bg-white rounded-2xl w-full max-w-2xl p-8 border border-stone-200 shadow-2xl mx-4 transform transition-all">
            <div class="flex items-center justify-between mb-6 border-b border-stone-100 pb-4">
                <h3 id="productModalTitle" class="text-xl font-bold text-stone-900">Nuevo Producto</h3>
                <button id="productModalClose" class="text-stone-400 hover:text-stone-600 text-xl transition">✕</button>
            </div>
            <form id="productForm" class="space-y-4">
                <input type="hidden" id="productId">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="md:col-span-1">
                        <label class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1">Nombre de la Pieza</label>
                        <input id="productName" required placeholder="Ej: Sofá Lino Praga 3 Plazas" class="w-full bg-stone-50 border border-stone-200 p-2.5 rounded-xl text-stone-900 text-sm focus:outline-none focus:ring-2 focus:ring-amber-600 focus:bg-white transition" />
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1">SKU / Referencia</label>
                        <input id="productSKU" placeholder="Ej: CH-7492-M" class="w-full bg-stone-50 border border-stone-200 p-2.5 rounded-xl text-stone-900 text-sm focus:outline-none focus:ring-2 focus:ring-amber-600 focus:bg-white transition" />
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1">Materiales y Descripción Corta</label>
                        <textarea id="productDescription" rows="2" placeholder="Detalles de acabado, maderas, dimensiones o tejidos..." class="w-full bg-stone-50 border border-stone-200 p-2.5 rounded-xl text-stone-900 text-sm focus:outline-none focus:ring-2 focus:ring-amber-600 focus:bg-white transition resize-none"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1">Precio de Venta (€)</label>
                        <input id="productPrice" type="number" step="0.01" required class="w-full bg-stone-50 border border-stone-200 p-2.5 rounded-xl text-stone-900 text-sm focus:outline-none focus:ring-2 focus:ring-amber-600 focus:bg-white transition" />
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1">Existencias en Almacén</label>
                        <input id="productStock" type="number" required class="w-full bg-stone-50 border border-stone-200 p-2.5 rounded-xl text-stone-900 text-sm focus:outline-none focus:ring-2 focus:ring-amber-600 focus:bg-white transition" />
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1">Colección / Categoría</label>
                        <select id="productCategory" required class="w-full bg-stone-50 border border-stone-200 p-2.5 rounded-xl text-stone-700 text-sm focus:outline-none focus:ring-2 focus:ring-amber-600 focus:bg-white transition">
                        </select>
                    </div>
                </div>
                <div class="flex justify-end pt-4 border-t border-stone-100 mt-6">
                    <button type="submit" id="productSubmit" class="bg-amber-700 hover:bg-amber-800 px-8 py-3 rounded-xl text-white font-bold shadow-sm transition text-sm">Crear</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let allProducts = [];

        document.addEventListener('DOMContentLoaded', () => {
            init();
            document.getElementById('searchProduct').addEventListener('input', filterProducts);
            document.getElementById('categoryFilter').addEventListener('change', filterProducts);
            document.getElementById('btnNewProduct').addEventListener('click', () => openProductForm('create'));
            document.getElementById('productModalClose').addEventListener('click', () => document.getElementById('productModal').classList.add('hidden'));
        });

        async function init() {
            await loadCategories();
            await loadProducts();
        }

        async function loadProducts() {
            try {
                const response = await fetch(`${API_BASE}/products/`);
                allProducts = await response.json();
                displayProducts(allProducts);
            } catch (error) {
                showError('Error al conectar con la base de datos de productos.');
            }
        }

        async function loadCategories() {
            try {
                const response = await fetch(`${API_BASE}/products/categories`);
                const categories = await response.json();
                
                const filterSelect = document.getElementById('categoryFilter');
                const formSelect = document.getElementById('productCategory');
                
                categories.forEach(cat => {
                    const opt = `<option value="${cat.id}">${cat.name}</option>`;
                    filterSelect.insertAdjacentHTML('beforeend', opt);
                    formSelect.insertAdjacentHTML('beforeend', opt);
                });
            } catch (e) { console.error('Categorías no disponibles'); }
        }

        function displayProducts(products) {
            const grid = document.getElementById('productsGrid');
            if (products.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center text-stone-400 py-12 text-sm font-medium">No se encontraron artículos en esta selección</div>';
                return;
            }
            
            grid.innerHTML = products.map(p => `
                <div class="bg-white rounded-2xl border border-stone-200 overflow-hidden hover:border-amber-600/40 hover:shadow-md transition-all duration-300 group shadow-sm flex flex-col">
                    <div class="bg-gradient-to-br from-stone-100 to-amber-50/50 h-32 flex items-center justify-center border-b border-stone-100 relative">
                        <i class="fas fa-couch text-stone-400 text-3xl group-hover:scale-105 transition-transform duration-300"></i>
                    </div>
                    <div class="p-5 flex-1 flex flex-col">
                        <div class="flex justify-between items-start gap-2 mb-1">
                            <h3 class="text-base font-bold text-stone-900 leading-tight group-hover:text-amber-800 transition-colors">${p.name}</h3>
                            <span class="text-[10px] bg-stone-50 text-stone-400 px-2 py-0.5 rounded-md border border-stone-200 font-mono shrink-0">${p.sku || 'N/A'}</span>
                        </div>
                        <p class="text-stone-500 text-xs mb-4 line-clamp-2 h-8 leading-relaxed">${p.description || 'Sin especificaciones añadidas'}</p>
                        
                        <div class="flex items-center justify-between p-3 bg-stone-50 rounded-xl mb-4 mt-auto">
                            <div>
                                <span class="block text-[9px] text-stone-400 uppercase font-bold tracking-wider">Tarifa</span>
                                <span class="text-lg font-bold text-stone-900">€${parseFloat(p.price).toFixed(2)}</span>
                            </div>
                            <div class="text-right">
                                <span class="block text-[9px] text-stone-400 uppercase font-bold tracking-wider">Disponibilidad</span>
                                <span class="text-xs font-semibold ${p.stock > 0 ? 'text-emerald-700' : 'text-rose-700'}">${p.stock} unidades</span>
                            </div>
                        </div>

                        <div class="flex gap-2 border-t border-stone-100 pt-3">
                            <button onclick="openProductForm('edit', ${p.id})" class="flex-1 bg-stone-100 hover:bg-amber-700 hover:text-white text-stone-700 py-2 rounded-xl transition text-xs font-bold flex items-center justify-center gap-1.5">
                                <i class="fas fa-edit text-xs"></i>Editar
                            </button>
                            <button onclick="deleteProduct(${p.id})" class="w-9 bg-stone-50 border border-stone-200 hover:bg-rose-50 hover:text-rose-700 hover:border-rose-200 text-stone-400 py-2 rounded-xl transition flex items-center justify-center">
                                <i class="fas fa-trash text-xs"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterProducts() {
            const query = document.getElementById('searchProduct').value.toLowerCase();
            const catId = document.getElementById('categoryFilter').value;
            
            const filtered = allProducts.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(query) || 
                                     (p.description && p.description.toLowerCase().includes(query)) ||
                                     (p.sku && p.sku.toLowerCase().includes(query));
                const matchesCat = !catId || p.category_id == catId;
                return matchesSearch && matchesCat;
            });
            displayProducts(filtered);
        }

        function openProductForm(mode, id = null) {
            const modal = document.getElementById('productModal');
            const form = document.getElementById('productForm');
            const submitBtn = document.getElementById('productSubmit');
            form.reset();

            if (mode === 'create') {
                document.getElementById('productModalTitle').textContent = 'Nuevo Producto';
                submitBtn.textContent = 'Crear Producto';
                submitBtn.dataset.mode = 'create';
                modal.classList.remove('hidden');
            } else {
                fetch(`${API_BASE}/products/${id}`).then(r => r.json()).then(p => {
                    document.getElementById('productId').value = p.id;
                    document.getElementById('productName').value = p.name;
                    document.getElementById('productSKU').value = p.sku || '';
                    document.getElementById('productDescription').value = p.description || '';
                    document.getElementById('productPrice').value = p.price;
                    document.getElementById('productStock').value = p.stock;
                    document.getElementById('productCategory').value = p.category_id;
                    
                    document.getElementById('productModalTitle').textContent = 'Editar Producto';
                    submitBtn.textContent = 'Guardar Cambios';
                    submitBtn.dataset.mode = 'edit';
                    modal.classList.remove('hidden');
                });
            }
        }

        document.getElementById('productForm').onsubmit = async (e) => {
            e.preventDefault();
            const mode = document.getElementById('productSubmit').dataset.mode;
            const id = document.getElementById('productId').value;
            const payload = {
                name: document.getElementById('productName').value,
                sku: document.getElementById('productSKU').value,
                description: document.getElementById('productDescription').value,
                price: parseFloat(document.getElementById('productPrice').value),
                stock: parseInt(document.getElementById('productStock').value),
                category_id: parseInt(document.getElementById('productCategory').value)
            };

            const url = mode === 'create' ? `${API_BASE}/products/` : `${API_BASE}/products/${id}`;
            try {
                const res = await fetch(url, {
                    method: mode === 'create' ? 'POST' : 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    document.getElementById('productModal').classList.add('hidden');
                    loadProducts();
                }
            } catch (err) { alert("Error al guardar el producto"); }
        };

        async function deleteProduct(id) {
            if (confirm('¿Deseas eliminar este producto del inventario de forma permanente?')) {
                await fetch(`${API_BASE}/products/${id}`, { method: 'DELETE' });
                loadProducts();
            }
        }

        function showError(message) {
            document.getElementById('productsGrid').innerHTML = `<div class="col-span-full text-center text-rose-700 font-medium py-12">❌ ${message}</div>`;
        }
    </script>
</body>
</html>
