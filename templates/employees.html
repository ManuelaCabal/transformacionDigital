<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipo | DecoHOME CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-gradient-to-br from-stone-50 via-stone-100 to-orange-50/30 text-stone-800 antialiased min-h-screen">
    <div class="min-h-screen">
        <nav class="bg-white border-b border-stone-200 sticky top-0 z-50 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center h-16">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-gradient-to-r from-amber-700 to-amber-600 rounded-lg flex items-center justify-center shadow-sm">
                            <i class="fas fa-chair text-white"></i>
                        </div>
                        <h1 class="text-2xl font-bold text-stone-900">Deco<span class="text-amber-700 font-light">HOME</span></h1>
                    </div>
                    <div class="flex items-center space-x-4">
                        <a href="/" class="text-stone-600 hover:text-amber-700 transition px-3 py-2 rounded-lg hover:bg-stone-100 font-medium text-sm">
                            <i class="fas fa-home mr-2"></i>Inicio
                        </a>
                    </div>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="mb-8 flex items-center justify-between">
                <div>
                    <h2 class="text-3xl font-bold text-stone-900 mb-1">Equipo - Empleados</h2>
                    <p class="text-stone-500 text-sm">Gestiona los asesores de interiorismo, diseñadores y especialistas de la firma</p>
                </div>
                <div class="flex items-center gap-3">
                    <a href="/dashboard" class="bg-white border border-stone-200 text-stone-700 px-4 py-2.5 rounded-xl hover:bg-stone-50 shadow-sm font-semibold transition text-sm">Regresar</a>
                    <button id="btnNewEmployee" class="bg-amber-700 hover:bg-amber-800 text-white px-5 py-2.5 rounded-xl font-semibold shadow-sm transition text-sm flex items-center">
                        <i class="fas fa-plus mr-2 text-xs"></i>Nuevo Empleado
                    </button>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-5 border border-stone-200 shadow-sm mb-8">
                <div class="flex gap-4">
                    <div class="flex-1 relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-stone-400">
                            <i class="fas fa-search text-sm"></i>
                        </span>
                        <input type="text" id="searchEmployee" placeholder="Buscar asesor o especialista..." 
                               class="w-full bg-stone-50 border border-stone-200 text-stone-900 rounded-xl pl-10 pr-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-600 focus:bg-white transition">
                    </div>
                    <select id="departmentFilter" class="bg-stone-50 border border-stone-200 text-stone-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-600 focus:bg-white transition">
                        <option value="">Todos los departamentos</option>
                    </select>
                </div>
            </div>

            <div class="bg-white rounded-2xl border border-stone-200 shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-stone-600">
                        <thead class="bg-stone-50 text-stone-500 uppercase text-xs tracking-wider border-b border-stone-200">
                            <tr>
                                <th class="px-6 py-4 text-left font-bold">Nombre</th>
                                <th class="px-6 py-4 text-left font-bold">Posición</th>
                                <th class="px-6 py-4 text-left font-bold">Departamento</th>
                                <th class="px-6 py-4 text-left font-bold">Email</th>
                                <th class="px-6 py-4 text-left font-bold">Teléfono</th>
                                <th class="px-6 py-4 text-left font-bold">Contratación</th>
                                <th class="px-6 py-4 text-left font-bold">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="employeesTableBody" class="divide-y divide-stone-100">
                            <tr><td colspan="7" class="px-6 py-8 text-center text-stone-400">Cargando nómina de DecoHOME...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_BASE = '/api';
        document.addEventListener('DOMContentLoaded', ()=>{
            loadEmployees();
            document.getElementById('searchEmployee').addEventListener('input', filterEmployees);
            document.getElementById('btnNewEmployee').addEventListener('click', ()=> openEmployeeForm('create'));
        });

        async function loadEmployees(){
            try{
                const res = await fetch(`${API_BASE}/employees/`);
                const data = await res.json();
                const list = data.employees || [];
                if(list.length===0) document.getElementById('employeesTableBody').innerHTML = '<tr><td colspan="7" class="px-6 py-8 text-center text-stone-400">No hay empleados registrados</td></tr>';
                else displayEmployees(list);
            }catch(e){ console.error(e); document.getElementById('employeesTableBody').innerHTML = `<tr><td colspan="7" class="px-6 py-8 text-center text-red-600 font-medium">${e.message}</td></tr>` }
        }

        function displayEmployees(list){
            const tbody = document.getElementById('employeesTableBody');
            tbody.innerHTML = list.map(emp=>`
                <tr class="hover:bg-stone-50 transition">
                    <td class="px-6 py-4 font-bold text-stone-900">${emp.first_name} ${emp.last_name}</td>
                    <td class="px-6 py-4 text-stone-700 font-medium">${emp.position||'-'}</td>
                    <td class="px-6 py-4 text-stone-600">${emp.department||'-'}</td>
                    <td class="px-6 py-4 text-stone-600"><i class="fas fa-envelope mr-2 text-stone-400 text-xs"></i>${emp.email||'-'}</td>
                    <td class="px-6 py-4 text-stone-600"><i class="fas fa-phone mr-2 text-stone-400 text-xs"></i>${emp.phone||'-'}</td>
                    <td class="px-6 py-4 text-stone-500">${emp.hire_date || '-'}</td>
                    <td class="px-6 py-4 text-stone-400">
                        <button onclick="openEmployeeForm('edit', ${emp.id})" class="text-amber-700 hover:text-amber-900 mr-3 transition"><i class="fas fa-edit text-base"></i></button>
                        <button onclick="deleteEmployee(${emp.id})" class="text-red-600 hover:text-red-800 transition"><i class="fas fa-trash text-base"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function filterEmployees(){
            const q = document.getElementById('searchEmployee').value.toLowerCase();
            document.querySelectorAll('#employeesTableBody tr').forEach(row=>{
                const name = row.cells[0].textContent.toLowerCase();
                row.style.display = name.includes(q) ? '' : 'none';
            });
        }

        // Modal form
        function openEmployeeForm(mode, id=null){
            const modalId = 'employeeModal';
            let modal = document.getElementById(modalId);
            if(!modal){
                createEmployeeModal();
                modal = document.getElementById(modalId);
            }
            const title = document.getElementById('employeeModalTitle');
            const submit = document.getElementById('employeeSubmit');
            document.getElementById('employeeForm').reset();
            document.getElementById('employeeId').value = '';
            if(mode==='create'){
                title.textContent='Nuevo Empleado'; submit.textContent='Crear Ficha'; submit.dataset.mode='create'; modal.classList.remove('hidden');
            } else {
                title.textContent='Editar Empleado'; submit.textContent='Guardar Cambios'; submit.dataset.mode='edit';
                fetch(`${API_BASE}/employees/${id}`).then(r=>r.json()).then(d=>{
                    if(d.error) return alert(d.error);
                    const e = d.employee || {};
                    document.getElementById('employeeId').value = e.id||'';
                    document.getElementById('firstName').value = e.first_name||'';
                    document.getElementById('lastName').value = e.last_name||'';
                    document.getElementById('position').value = e.position||'';
                    document.getElementById('department').value = e.department||'';
                    document.getElementById('employeeEmail').value = e.email||'';
                    document.getElementById('employeePhone').value = e.phone||'';
                    document.getElementById('hireDate').value = e.hire_date||'';
                    modal.classList.remove('hidden');
                }).catch(err=>alert(err.message));
            }
        }

        // Modificado dinámicamente con las clases orgánicas y limpias de DecoHOME
        function createEmployeeModal(){
            const html = `
            <div id="employeeModal" class="fixed inset-0 bg-stone-900/60 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                <div class="bg-white rounded-2xl w-full max-w-2xl p-6 border border-stone-200 shadow-2xl transform transition-all">
                    <div class="flex items-center justify-between mb-4 border-b border-stone-100 pb-3">
                        <h3 id="employeeModalTitle" class="text-lg font-bold text-stone-900">Nuevo Empleado</h3>
                        <button id="employeeModalClose" class="text-stone-400 hover:text-stone-600 transition">✕</button>
                    </div>
                    <form id="employeeForm" class="space-y-4">
                        <input type="hidden" id="employeeId">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1">Nombre</label>
                                <input id="firstName" required placeholder="Nombre" class="w-full bg-stone-50 border border-stone-200 p-2.5 rounded-xl text-stone-900 text-sm focus:outline-none focus:ring-2 focus:ring-amber-600 focus:bg-white transition" />
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1">Apellido</label>
                                <input id="lastName" required placeholder="Apellido" class="w-full bg-stone-50 border border-stone-200 p-2.5 rounded-xl text-stone-900 text-sm focus:outline-none focus:ring-2 focus:ring-amber-600 focus:bg-white transition" />
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1">Posición / Cargo</label>
                                <input id="position" placeholder="Ej: Interiorista Senior" class="w-full bg-stone-50 border border-stone-200 p-2.5 rounded-xl text-stone-900 text-sm focus:outline-none focus:ring-2 focus:ring-amber-600 focus:bg-white transition" />
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1">Departamento</label>
                                <input id="department" placeholder="Ej: Proyectos, Ventas" class="w-full bg-stone-50 border border-stone-200 p-2.5 rounded-xl text-stone-900 text-sm focus:outline-none focus:ring-2 focus:ring-amber-600 focus:bg-white transition" />
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1">Email Corporativo</label>
                                <input id="employeeEmail" type="email" placeholder="correo@decohome.com" class="w-full bg-stone-50 border border-stone-200 p-2.5 rounded-xl text-stone-900 text-sm focus:outline-none focus:ring-2 focus:ring-amber-600 focus:bg-white transition" />
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1">Teléfono</label>
                                <input id="employeePhone" placeholder="+34 600 000 000" class="w-full bg-stone-50 border border-stone-200 p-2.5 rounded-xl text-stone-900 text-sm focus:outline-none focus:ring-2 focus:ring-amber-600 focus:bg-white transition" />
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1">Fecha de contratación</label>
                                <input id="hireDate" type="date" class="w-full bg-stone-50 border border-stone-200 p-2.5 rounded-xl text-stone-900 text-sm focus:outline-none focus:ring-2 focus:ring-amber-600 focus:bg-white transition" />
                            </div>
                        </div>
                        <div class="flex justify-end pt-4 border-t border-stone-100 mt-5">
                            <button type="submit" id="employeeSubmit" data-mode="create" class="bg-amber-700 hover:bg-amber-800 px-6 py-2.5 rounded-xl text-white font-bold shadow-sm transition text-sm">Crear</button>
                        </div>
                    </form>
                </div>
            </div>
            `;
            document.body.insertAdjacentHTML('beforeend', html);
            document.getElementById('employeeModalClose').addEventListener('click', ()=> document.getElementById('employeeModal').classList.add('hidden'));
            document.getElementById('employeeForm').addEventListener('submit', employeeFormSubmit);
        }

        function employeeFormSubmit(e){
            e.preventDefault();
            const id = document.getElementById('employeeId').value;
            const payload = {
                first_name: document.getElementById('firstName').value,
                last_name: document.getElementById('lastName').value,
                position: document.getElementById('position').value,
                department: document.getElementById('department').value,
                email: document.getElementById('employeeEmail').value,
                phone: document.getElementById('employeePhone').value,
                hire_date: document.getElementById('hireDate').value
            };
            const mode = document.getElementById('employeeSubmit').dataset.mode || 'create';
            if(mode==='create'){
                fetch(`${API_BASE}/employees/`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)})
                    .then(r=>r.json()).then(res=>{ if(res.error) return alert(res.error); loadEmployees(); document.getElementById('employeeModal').classList.add('hidden'); })
                    .catch(err=>alert(err.message));
            } else {
                fetch(`${API_BASE}/employees/${id}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)})
                    .then(r=>r.json()).then(res=>{ if(res.error) return alert(res.error); loadEmployees(); document.getElementById('employeeModal').classList.add('hidden'); })
                    .catch(err=>alert(err.message));
            }
        }

        function deleteEmployee(id){ if(confirm('¿Eliminar empleado permanentemente?')){ fetch(`${API_BASE}/employees/${id}`, { method:'DELETE' }).then(r=>r.json()).then(res=>{ if(res.error) return alert(res.error); loadEmployees(); }).catch(err=>alert(err.message)); } }
    </script>
</body>
</html>
