<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - CRM TechSolutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900">
    <div class="min-h-screen">
        <nav class="bg-slate-950 border-b border-slate-700 sticky top-0 z-50 shadow-lg">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center h-16">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-gradient-to-r from-blue-500 to-purple-600 rounded-lg flex items-center justify-center">
                            <i class="fas fa-file-invoice-dollar text-white"></i>
                        </div>
                        <h1 class="text-2xl font-bold text-white">TechSolutions CRM</h1>
                    </div>
                    <div class="flex items-center space-x-4">
                        <a href="/" class="text-slate-300 hover:text-white transition px-3 py-2 rounded-lg hover:bg-slate-800">
                            <i class="fas fa-home mr-2"></i>Inicio
                        </a>
                    </div>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="mb-8 flex items-center justify-between">
                <div>
                    <h2 class="text-3xl font-bold text-white mb-2">Gestión de Pedidos</h2>
                    <p class="text-slate-400">Administración de ventas y facturación</p>
                </div>
                <div class="flex items-center gap-4">
                    <a href="/dashboard" class="bg-slate-700 text-white px-4 py-2 rounded-lg hover:bg-slate-600 transition">Regresar</a>
                    <button id="btnNewOrder" class="bg-orange-600 hover:bg-orange-700 text-white px-6 py-3 rounded-lg font-semibold transition shadow-lg shadow-orange-500/20">
                        <i class="fas fa-plus mr-2"></i>Nuevo Pedido
                    </button>
                </div>
            </div>

            <div class="bg-slate-800 rounded-xl p-6 border border-slate-700 mb-8 shadow-xl">
                <div class="flex flex-wrap gap-4">
                    <div class="flex-1 min-w-[200px]">
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Estado del Pedido</label>
                        <select id="statusFilter" class="w-full bg-slate-900 border border-slate-700 text-white rounded-lg px-4 py-2.5 focus:border-orange-500 outline-none transition">
                            <option value="">Todos los estados</option>
                            <option value="pendiente">Pendiente</option>
                            <option value="confirmado">Confirmado</option>
                            <option value="enviado">Enviado</option>
                            <option value="entregado">Entregado</option>
                            <option value="cancelado">Cancelado</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-2xl">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-slate-300">
                        <thead class="bg-slate-950 border-b border-slate-700">
                            <tr>
                                <th class="px-6 py-4 text-left text-white font-bold uppercase tracking-wider">Nº Pedido</th>
                                <th class="px-6 py-4 text-left text-white font-bold uppercase tracking-wider">Cliente</th>
                                <th class="px-6 py-4 text-left text-white font-bold uppercase tracking-wider">Fecha</th>
                                <th class="px-6 py-4 text-left text-white font-bold uppercase tracking-wider">Total</th>
                                <th class="px-6 py-4 text-left text-white font-bold uppercase tracking-wider">Estado</th>
                                <th class="px-6 py-4 text-center text-white font-bold uppercase tracking-wider">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="ordersTableBody">
                            <tr><td colspan="6" class="px-6 py-12 text-center text-slate-500">Cargando pedidos...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="orderModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center hidden z-[100]">
        <div class="bg-slate-900 rounded-2xl w-full max-w-4xl p-8 border border-slate-700 shadow-2xl mx-4 overflow-y-auto max-h-[90vh]">
            <div class="flex items-center justify-between mb-6">
                <h3 id="orderModalTitle" class="text-xl font-bold text-white">Nuevo Pedido</h3>
                <button id="orderModalClose" class="text-slate-400 hover:text-white text-2xl">✕</button>
            </div>
            
            <form id="orderForm" class="space-y-6">
                <input type="hidden" id="orderId">
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="md:col-span-1">
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">ID de Pedido (Único)</label>
                        <input id="orderNumber" required placeholder="PED-001" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl text-white focus:border-orange-500 outline-none transition" />
                    </div>
                    <div class="md:col-span-1">
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Cliente</label>
                        <select id="orderClient" required class="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl text-white focus:border-orange-500 outline-none transition"></select>
                    </div>
                    <div class="md:col-span-1">
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Método de Pago</label>
                        <select id="orderPayment" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl text-white focus:border-orange-500 outline-none transition">
                            <option value="transferencia">Transferencia</option>
                            <option value="tarjeta">Tarjeta</option>
                            <option value="efectivo">Efectivo</option>
                        </select>
                    </div>
                </div>

                <div class="border-t border-slate-800 pt-6">
                    <div class="flex justify-between items-center mb-4">
                        <h4 class="text-sm font-bold text-slate-400 uppercase tracking-wider">Productos en el pedido</h4>
                        <button type="button" onclick="addOrderItemRow()" class="bg-blue-600/20 text-blue-400 border border-blue-500/30 px-4 py-2 rounded-lg hover:bg-blue-600 hover:text-white transition text-xs font-bold">
                            <i class="fas fa-plus mr-2"></i>Añadir Línea
                        </button>
                    </div>
                    <div id="orderItems" class="space-y-3"></div>
                </div>

                <div class="flex justify-end pt-4 border-t border-slate-800">
                    <button type="submit" id="orderSubmit" class="bg-orange-600 hover:bg-orange-700 px-10 py-3 rounded-xl text-white font-bold transition shadow-lg shadow-orange-500/20">
                        Guardar Pedido
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let allOrders = [];
        let productsCache = [];

        document.addEventListener('DOMContentLoaded', () => {
            init();
            document.getElementById('statusFilter').addEventListener('change', filterOrders);
            document.getElementById('btnNewOrder').addEventListener('click', () => openOrderForm('create'));
            document.getElementById('orderModalClose').addEventListener('click', () => document.getElementById('orderModal').classList.add('hidden'));
        });

        async function init() {
            await loadOrders();
            try {
                const [clientsRes, productsRes] = await Promise.all([
                    fetch(`${API_BASE}/clients/`).then(r => r.json()),
                    fetch(`${API_BASE}/products/`).then(r => r.json())
                ]);
                const clientSel = document.getElementById('orderClient');
                (clientsRes.clients || clientsRes).forEach(c => {
                    clientSel.insertAdjacentHTML('beforeend', `<option value="${c.id}">${c.name}</option>`);
                });
                productsCache = productsRes.products || productsRes;
            } catch (e) { console.error("Error cargando datos", e); }
        }

        async function loadOrders() {
            try {
                const response = await fetch(`${API_BASE}/orders/`);
                if (!response.ok) throw new Error(response.status);
                const data = await response.json();
                allOrders = data.orders || data;
                displayOrders(allOrders);
            } catch (error) {
                showError(`Error ${error.message}: No se pudo acceder a los pedidos.`);
            }
        }

        function displayOrders(orders) {
            const tbody = document.getElementById('ordersTableBody');
            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-slate-500">No hay pedidos</td></tr>';
                return;
            }
            tbody.innerHTML = orders.map(o => `
                <tr class="border-b border-slate-700 hover:bg-slate-700/30 transition">
                    <td class="px-6 py-4 font-mono text-orange-400 font-bold">${o.order_number}</td>
                    <td class="px-6 py-4 text-white">${o.client_name || 'Desconocido'}</td>
                    <td class="px-6 py-4 text-slate-400">${o.order_date}</td>
                    <td class="px-6 py-4 font-bold text-green-400">€${parseFloat(o.final_amount).toFixed(2)}</td>
                    <td class="px-6 py-4">
                        <span class="px-3 py-1 rounded-lg text-[10px] font-black uppercase border ${getStatusClass(o.status)}">${o.status}</span>
                    </td>
                    <td class="px-6 py-4 text-center">
                        <button onclick="deleteOrder(${o.id})" class="text-slate-400 hover:text-red-400 transition"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function getStatusClass(status) {
            const map = {
                'entregado': 'text-green-400 border-green-500/30 bg-green-500/10',
                'enviado': 'text-blue-400 border-blue-500/30 bg-blue-500/10',
                'pendiente': 'text-yellow-400 border-yellow-500/30 bg-yellow-500/10',
                'cancelado': 'text-red-400 border-red-500/30 bg-red-500/10'
            };
            return map[status] || 'text-slate-400 border-slate-500/30';
        }

        function addOrderItemRow() {
            const container = document.getElementById('orderItems');
            const rowId = Date.now();
            const rowHtml = `
                <div id="row-${rowId}" class="grid grid-cols-1 md:grid-cols-12 gap-3 bg-slate-950/40 p-4 rounded-xl border border-slate-800 items-end">
                    <div class="md:col-span-6">
                        <label class="block text-[10px] text-slate-500 uppercase mb-1 font-bold">Producto</label>
                        <select onchange="updateRowPrice(this, ${rowId})" class="item-product w-full bg-slate-800 border border-slate-700 p-2 rounded-lg text-white text-sm outline-none">
                            <option value="">Seleccionar...</option>
                            ${productsCache.map(p => `<option value="${p.id}" data-price="${p.price}">${p.name} (€${p.price})</option>`).join('')}
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-[10px] text-slate-500 uppercase mb-1 font-bold">Cant.</label>
                        <input type="number" min="1" value="1" class="item-qty w-full bg-slate-800 border border-slate-700 p-2 rounded-lg text-white text-sm outline-none" />
                    </div>
                    <div class="md:col-span-3">
                        <label class="block text-[10px] text-slate-500 uppercase mb-1 font-bold">Precio Unit.</label>
                        <input type="number" step="0.01" class="item-price w-full bg-slate-800 border border-slate-700 p-2 rounded-lg text-white text-sm outline-none" />
                    </div>
                    <div class="md:col-span-1 flex justify-end">
                        <button type="button" onclick="document.getElementById('row-${rowId}').remove()" class="text-red-500 p-2 hover:bg-red-500/10 rounded-lg transition"><i class="fas fa-times"></i></button>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', rowHtml);
        }

        function updateRowPrice(select, rowId) {
            const price = select.options[select.selectedIndex].dataset.price;
            if(price) document.getElementById(`row-${rowId}`).querySelector('.item-price').value = price;
        }

        function openOrderForm(mode) {
            const modal = document.getElementById('orderModal');
            document.getElementById('orderForm').reset();
            document.getElementById('orderItems').innerHTML = '';
            document.getElementById('orderNumber').value = 'PED-' + Math.floor(Math.random() * 10000);
            addOrderItemRow();
            modal.classList.remove('hidden');
        }

        document.getElementById('orderForm').onsubmit = async (e) => {
            e.preventDefault();
            const items = [];
            document.querySelectorAll('#orderItems > div').forEach(row => {
                const pid = row.querySelector('.item-product').value;
                if(pid) items.push({
                    product_id: parseInt(pid),
                    quantity: parseInt(row.querySelector('.item-qty').value),
                    unit_price: parseFloat(row.querySelector('.item-price').value)
                });
            });

            const payload = {
                order_number: document.getElementById('orderNumber').value,
                client_id: parseInt(document.getElementById('orderClient').value),
                payment_method: document.getElementById('orderPayment').value,
                order_date: new Date().toISOString().split('T')[0],
                items: items
            };

            try {
                const res = await fetch(`${API_BASE}/orders/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    document.getElementById('orderModal').classList.add('hidden');
                    loadOrders();
                } else {
                    const errorData = await res.json();
                    alert("Error: " + (errorData.error || "No autorizado o datos inválidos"));
                }
            } catch (err) { alert("Error de red"); }
        };

        async function deleteOrder(id) {
            if(confirm('¿Eliminar pedido?')) {
                await fetch(`${API_BASE}/orders/${id}`, { method: 'DELETE' });
                loadOrders();
            }
        }

        function filterOrders() {
            const val = document.getElementById('statusFilter').value;
            const filtered = val ? allOrders.filter(o => o.status === val) : allOrders;
            displayOrders(filtered);
        }

        function showError(msg) {
            document.getElementById('ordersTableBody').innerHTML = `<tr><td colspan="6" class="px-6 py-8 text-center text-red-400">❌ ${msg}</td></tr>`;
        }
    </script>
</body>
</html>
