<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes | DecoHOME CRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-gradient-to-br from-stone-50 via-stone-100 to-orange-50/30 text-stone-800 antialiased min-h-screen">
    <div class="min-h-screen">
        <nav class="bg-white border-b border-stone-200 sticky top-0 z-50 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center h-16">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-gradient-to-r from-amber-700 to-amber-600 rounded-lg flex items-center justify-center shadow-sm">
                            <i class="fas fa-chair text-white"></i>
                        </div>
                        <h1 class="text-2xl font-bold text-stone-900">Deco<span class="text-amber-700 font-light">HOME</span></h1>
                    </div>
                    <div class="flex items-center space-x-4">
                        <a href="/" class="text-stone-600 hover:text-amber-700 transition px-3 py-2 rounded-lg hover:bg-stone-100 font-medium text-sm">
                            <i class="fas fa-home mr-2"></i>Inicio
                        </a>
                    </div>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="mb-8 flex items-center justify-between">
                <div>
                    <h2 class="text-3xl font-bold text-stone-900 mb-1">Gestión de Clientes</h2>
                    <p class="text-stone-500 text-sm">Administra tu cartera de compradores, estudios asociados y cuentas de proyectos</p>
                </div>
                <div class="flex items-center gap-3">
                    <a href="/dashboard" class="bg-white border border-stone-200 text-stone-700 px-4 py-2.5 rounded-xl hover:bg-stone-50 shadow-sm font-semibold transition text-sm">Regresar</a>
                    <button id="btnNewClient" class="bg-amber-700 hover:bg-amber-800 text-white px-5 py-2.5 rounded-xl font-semibold shadow-sm transition text-sm flex items-center">
                        <i class="fas fa-plus mr-2 text-xs"></i>Nuevo Cliente
                    </button>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-5 border border-stone-200 shadow-sm mb-8">
                <div class="flex flex-wrap gap-4">
                    <div class="flex-1 min-w-[250px] relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-stone-400">
                            <i class="fas fa-search text-sm"></i>
                        </span>
                        <input type="text" id="searchClient" placeholder="Buscar por nombre, estudio o empresa..." 
                               class="w-full bg-stone-50 border border-stone-200 text-stone-900 rounded-xl pl-10 pr-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-600 focus:bg-white transition">
                    </div>
                    <select id="statusFilter" class="bg-stone-50 border border-stone-200 text-stone-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-600 focus:bg-white transition">
                        <option value="">Todos los estados</option>
                        <option value="prospect">Prospecto / Lead</option>
                        <option value="activo">Activo (Con Proyecto)</option>
                        <option value="inactivo">Inactivo</option>
                        <option value="cliente_perdido">Perdido</option>
                    </select>
                </div>
            </div>

            <div class="bg-white rounded-2xl border border-stone-200 shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-stone-600">
                        <thead class="bg-stone-50 text-stone-500 uppercase text-xs tracking-wider border-b border-stone-200">
                            <tr>
                                <th class="px-6 py-4 text-left font-bold">Cliente / Estudio</th>
                                <th class="px-6 py-4 text-left font-bold">Contacto</th>
                                <th class="px-6 py-4 text-left font-bold">Estado</th>
                                <th class="px-6 py-4 text-left font-bold">Canal / Sector</th>
                                <th class="px-6 py-4 text-left font-bold">Volumen (CLV)</th>
                                <th class="px-6 py-4 text-left font-bold">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="clientsTableBody" class="divide-y divide-stone-100">
                            <tr><td colspan="6" class="px-6 py-8 text-center text-stone-400">Cargando clientes de DecoHOME...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <div id="clientModal" class="fixed inset-0 bg-stone-900/60 backdrop-blur-sm flex items-center justify-center hidden z-[100]">
        <div class="bg-white rounded-2xl w-full max-w-2xl p-8 border border-stone-200 shadow-2xl mx-4 transform transition-all">
            <div class="flex items-center justify-between mb-6 border-b border-stone-100 pb-4">
                <h3 id="clientModalTitle" class="text-xl font-bold text-stone-900">Nuevo Cliente</h3>
                <button id="clientModalClose" class="text-stone-400 hover:text-stone-600 text-xl transition">✕</button>
            </div>
            <form id="clientForm" class="space-y-4">
                <input type="hidden" id="clientId">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="col-span-2">
                        <label class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1">Nombre Completo / Titular</label>
                        <input id="clientName" required class="w-full bg-stone-50 border border-stone-200 p-2.5 rounded-xl text-stone-900 focus:outline-none focus:ring-2 focus:ring-amber-600 focus:bg-white transition text-sm" />
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1">Email de Contacto</label>
                        <input id="clientEmail" type="email" required class="w-full bg-stone-50 border border-stone-200 p-2.5 rounded-xl text-stone-900 focus:outline-none focus:ring-2 focus:ring-amber-600 focus:bg-white transition text-sm" />
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1">Teléfono</label>
                        <input id="clientPhone" class="w-full bg-stone-50 border border-stone-200 p-2.5 rounded-xl text-stone-900 focus:outline-none focus:ring-2 focus:ring-amber-600 focus:bg-white transition text-sm" />
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1">Estudio / Empresa</label>
                        <input id="clientCompany" placeholder="Ej: Particular o Arquitectura ABC" class="w-full bg-stone-50 border border-stone-200 p-2.5 rounded-xl text-stone-900 focus:outline-none focus:ring-2 focus:ring-amber-600 focus:bg-white transition text-sm" />
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1">Canal (Particular / Profesional)</label>
                        <input id="clientIndustry" placeholder="Ej: Residencial, Contract, Reformas" class="w-full bg-stone-50 border border-stone-200 p-2.5 rounded-xl text-stone-900 focus:outline-none focus:ring-2 focus:ring-amber-600 focus:bg-white transition text-sm" />
                    </div>
                    <div class="col-span-2">
                        <label class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1">Dirección de Envío / Obra</label>
                        <input id="clientAddress" class="w-full bg-stone-50 border border-stone-200 p-2.5 rounded-xl text-stone-900 focus:outline-none focus:ring-2 focus:ring-amber-600 focus:bg-white transition text-sm" />
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1">Estado de Cuenta</label>
                        <select id="clientStatus" class="w-full bg-stone-50 border border-stone-200 p-2.5 rounded-xl text-stone-900 focus:outline-none focus:ring-2 focus:ring-amber-600 focus:bg-white transition text-sm">
                            <option value="prospect">Prospecto</option>
                            <option value="activo">Activo</option>
                            <option value="inactivo">Inactivo</option>
                            <option value="cliente_perdido">Perdido</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-stone-500 uppercase tracking-wider mb-1">País</label>
                        <input id="clientCountry" value="España" class="w-full bg-stone-50 border border-stone-200 p-2.5 rounded-xl text-stone-900 focus:outline-none focus:ring-2 focus:ring-amber-600 focus:bg-white transition text-sm" />
                    </div>
                </div>
                <div class="flex justify-end pt-4 border-t border-stone-100 mt-6">
                    <button type="submit" id="clientSubmit" class="bg-amber-700 hover:bg-amber-800 px-6 py-2.5 rounded-xl text-white font-bold shadow-sm transition text-sm">Crear</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = '/api';

        document.addEventListener('DOMContentLoaded', () => {
            loadClients();
            document.getElementById('searchClient').addEventListener('input', filterClients);
            document.getElementById('statusFilter').addEventListener('change', filterClients);
            document.getElementById('btnNewClient').addEventListener('click', () => openClientForm('create'));
            document.getElementById('clientModalClose').addEventListener('click', () => document.getElementById('clientModal').classList.add('hidden'));
        });

        async function loadClients() {
            try {
                const response = await fetch(`${API_BASE}/clients/`);
                const data = await response.json();
                displayClients(data.clients || []);
            } catch (error) {
                showError('Error de conexión con el servidor');
            }
        }

        function displayClients(clients) {
            const tbody = document.getElementById('clientsTableBody');
            if (clients.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-8 text-center text-stone-400">No hay clientes registrados</td></tr>';
                return;
            }
            tbody.innerHTML = clients.map(c => `
                <tr class="hover:bg-stone-50 transition">
                    <td class="px-6 py-4">
                        <div class="font-bold text-stone-900">${c.name}</div>
                        <div class="text-xs text-stone-400">${c.company || 'Particular'}</div>
                    </td>
                    <td class="px-6 py-4 text-stone-600">
                        <div class="flex flex-col text-xs space-y-0.5">
                            <span><i class="fas fa-envelope mr-2 text-stone-400"></i>${c.email}</span>
                            <span><i class="fas fa-phone mr-2 text-stone-400"></i>${c.phone || '-'}</span>
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <span class="px-2.5 py-1 rounded-lg text-[10px] font-bold uppercase ${getStatusClass(c.status)}">${c.status}</span>
                    </td>
                    <td class="px-6 py-4 text-stone-700 font-medium">${c.industry || '-'}</td>
                    <td class="px-6 py-4 font-bold text-stone-900">€${(c.customer_lifetime_value || 0).toLocaleString()}</td>
                    <td class="px-6 py-4 text-stone-400">
                        <button onclick="openClientForm('edit', ${c.id})" class="text-amber-700 hover:text-amber-900 mr-3 transition"><i class="fas fa-edit text-base"></i></button>
                        <button onclick="deleteClient(${c.id})" class="text-red-600 hover:text-red-800 transition"><i class="fas fa-trash text-base"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function getStatusClass(status) {
            const map = {
                'activo': 'bg-emerald-100 text-emerald-800',
                'prospect': 'bg-amber-100 text-amber-800',
                'inactivo': 'bg-stone-100 text-stone-700',
                'cliente_perdido': 'bg-red-100 text-red-800'
            };
            return map[status] || 'bg-stone-100 text-stone-600';
        }

        function filterClients() {
            const search = document.getElementById('searchClient').value.toLowerCase();
            const status = document.getElementById('statusFilter').value.toLowerCase();
            const rows = document.querySelectorAll('#clientsTableBody tr');
            
            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                const matchesSearch = text.includes(search);
                const matchesStatus = !status || text.includes(status);
                row.style.display = matchesSearch && matchesStatus ? '' : 'none';
            });
        }

        function openClientForm(mode, id = null) {
            const modal = document.getElementById('clientModal');
            const submitBtn = document.getElementById('clientSubmit');
            document.getElementById('clientForm').reset();
            
            if (mode === 'create') {
                document.getElementById('clientModalTitle').textContent = 'Nuevo Cliente';
                submitBtn.textContent = 'Crear';
                submitBtn.dataset.mode = 'create';
                modal.classList.remove('hidden');
            } else {
                fetch(`${API_BASE}/clients/${id}`).then(r => r.json()).then(data => {
                    const c = data.client;
                    document.getElementById('clientId').value = c.id;
                    document.getElementById('clientName').value = c.name;
                    document.getElementById('clientEmail').value = c.email;
                    document.getElementById('clientPhone').value = c.phone || '';
                    document.getElementById('clientCompany').value = c.company || '';
                    document.getElementById('clientIndustry').value = c.industry || '';
                    document.getElementById('clientAddress').value = c.address || '';
                    document.getElementById('clientStatus').value = c.status;
                    
                    document.getElementById('clientModalTitle').textContent = 'Editar Cliente';
                    submitBtn.textContent = 'Guardar Cambios';
                    submitBtn.dataset.mode = 'edit';
                    modal.classList.remove('hidden');
                });
            }
        }

        document.getElementById('clientForm').onsubmit = async (e) => {
            e.preventDefault();
            const mode = document.getElementById('clientSubmit').dataset.mode;
            const id = document.getElementById('clientId').value;
            const payload = {
                name: document.getElementById('clientName').value,
                email: document.getElementById('clientEmail').value,
                phone: document.getElementById('clientPhone').value,
                company: document.getElementById('clientCompany').value,
                industry: document.getElementById('clientIndustry').value,
                address: document.getElementById('clientAddress').value,
                status: document.getElementById('clientStatus').value
            };

            const url = mode === 'create' ? `${API_BASE}/clients/` : `${API_BASE}/clients/${id}`;
            const method = mode === 'create' ? 'POST' : 'PUT';

            try {
                const res = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    document.getElementById('clientModal').classList.add('hidden');
                    loadClients();
                }
            } catch (err) { alert("Error al procesar"); }
        };

        function deleteClient(id) {
            if (confirm('¿Eliminar este cliente permanentemente?')) {
                fetch(`${API_BASE}/clients/${id}`, { method: 'DELETE' })
                    .then(() => loadClients());
            }
        }

        function showError(msg) {
            document.getElementById('clientsTableBody').innerHTML = `<tr><td colspan="6" class="px-6 py-8 text-center text-red-600">${msg}</td></tr>`;
        }
    </script>
</body>
</html>
